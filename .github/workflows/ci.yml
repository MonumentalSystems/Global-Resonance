name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  solar-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solar-monitor -> target
      - name: Test production Rust surface
        run: cargo test --manifest-path solar-monitor/Cargo.toml --lib --bin solar-monitor
      - name: Check production Rust binary
        run: cargo check --manifest-path solar-monitor/Cargo.toml --bin solar-monitor

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m compileall -q backend
      - run: python -m pytest -q
      - name: Test solar HTTP and SSE proxy contract
        run: python -m unittest backend.test_solar_proxy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
